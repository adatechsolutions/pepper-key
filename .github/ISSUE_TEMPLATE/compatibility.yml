name: Compatibility report
description: Record a browser or relying-party result without overgeneralizing it.
title: "compat: "
labels: [compatibility]
body:
  - type: input
    id: platform
    attributes:
      label: OS and browser versions
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: Disposable test service or harness
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Operation
      options: [Registration, Authentication, Recovery, Timeout, Fault injection]
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Redacted result and evidence
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I retained an independent authenticator and recovery path.
          required: true
        - label: I removed account, device, and credential identifiers.
          required: true
